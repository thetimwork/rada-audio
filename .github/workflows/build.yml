name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/rada-audio-0.1.0-alpha${GITHUB_RUN_NUMBER}.apk"
          sha256sum out/*.apk > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rada-audio-apk
          path: out/

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-${{ github.run_number }}
          name: RADA audio 0.1.0-alpha${{ github.run_number }}
          prerelease: true
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          body: |
            Standard engine alpha. Install on Android 9 or later (allow installs from unknown sources).
            Signed with the shared alpha test key, so each new alpha installs over the last one.
